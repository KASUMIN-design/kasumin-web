<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dental Clinic Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fbfaf8; }
  body {
    font-family: 'Cormorant Garamond', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #1e1a16;
    -webkit-font-smoothing: antialiased;
  }
  .gallery {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 14px 16px;
  }

  /* ---- 大きな絵 ---- */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1191 / 843;
    background: #fff;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(30, 26, 22, 0.05), 0 8px 28px rgba(30, 26, 22, 0.14), 0 2px 6px rgba(30, 26, 22, 0.08);
  }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    user-select: none;
  }
  .stage img.is-active { opacity: 1; }

  /* 前へ / 次へ */
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: rgba(251, 250, 248, 0.82);
    color: #5a5248;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.25s ease, background 0.25s ease;
    font-family: inherit;
  }
  .nav:hover { background: #fff; }
  .stage:hover .nav { opacity: 1; }
  .nav.prev { left: 12px; }
  .nav.next { right: 12px; }

  /* ---- キャプション ---- */
  .caption {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    padding: 12px 2px 14px;
  }
  .caption .count { font-size: 14px; letter-spacing: 0.2em; color: #8a8378; }

  /* ---- サムネイル ---- */
  .thumbs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .thumb {
    position: relative;
    border: 0;
    padding: 0;
    background: #fff;
    cursor: pointer;
    aspect-ratio: 1191 / 843;
    overflow: hidden;
    opacity: 0.62;
    transition: opacity 0.3s ease;
    box-shadow: 0 0 0 1px rgba(30, 26, 22, 0.05), 0 4px 12px rgba(30, 26, 22, 0.16);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb:hover { opacity: 0.8; }
  .thumb.is-active { opacity: 1; }
  .thumb.is-active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: #8d9680;
  }
  .thumb:focus-visible, .nav:focus-visible { outline: 2px solid #8d9680; outline-offset: 2px; }

  @media (max-width: 600px) {
    .gallery { padding: 6px 8px 12px; }
    .thumbs { gap: 6px; }
    .caption { padding: 8px 2px 10px; }
    .nav { opacity: 1; width: 36px; height: 36px; font-size: 16px; }
    .nav.prev { left: 6px; }
    .nav.next { right: 6px; }
  }
</style>
</head>
<body>
<div class="gallery" id="gallery">
  <div class="stage" id="stage" aria-live="polite">
    <button class="nav prev" id="prev" aria-label="前の画像">&#8592;</button>
    <button class="nav next" id="next" aria-label="次の画像">&#8594;</button>
  </div>
  <div class="caption">
    <span class="count" id="count"></span>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>

<script>
// 表示順・ファイル名・ラベルはここだけ編集すればOK
var ITEMS = [
  { src: 'concept.jpg',  thumb: 'concept_s.jpg',  label: 'Concept  方向性' },
  { src: 'element.jpg',  thumb: 'element_s.jpg',  label: 'Design Point  要素' },
  { src: 'plan.jpg',     thumb: 'plan_s.jpg',     label: 'Planning  平面プラン・ゾーニング' },
  { src: 'waiting.jpg',  thumb: 'waiting_s.jpg',  label: 'Perspective  待合室' },
  { src: 'clinic.jpg',   thumb: 'clinic_s.jpg',   label: 'Perspective  診療室' },
  { src: 'material.jpg', thumb: 'material_s.jpg', label: 'Material Image  素材イメージ' }
];

var stage  = document.getElementById('stage');
var thumbs = document.getElementById('thumbs');
var count  = document.getElementById('count');
var current = 0;
var bigEls = [], thumbEls = [];

ITEMS.forEach(function (item, i) {
  var img = document.createElement('img');
  img.src = item.src;
  img.alt = item.label;
  img.decoding = 'async';
  stage.insertBefore(img, stage.firstChild);
  bigEls[i] = img;

  var btn = document.createElement('button');
  btn.className = 'thumb';
  btn.setAttribute('aria-label', item.label);
  var t = document.createElement('img');
  t.src = item.thumb; t.alt = '';
  btn.appendChild(t);
  btn.addEventListener('click', function () { show(i); });
  thumbs.appendChild(btn);
  thumbEls[i] = btn;
});

function show(i) {
  current = (i + ITEMS.length) % ITEMS.length;
  bigEls.forEach(function (el, k) { el.classList.toggle('is-active', k === current); });
  thumbEls.forEach(function (el, k) { el.classList.toggle('is-active', k === current); });
  count.textContent = (current + 1) + ' / ' + ITEMS.length;
}

document.getElementById('prev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
document.getElementById('next').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
stage.addEventListener('click', function () { show(current + 1); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft')  show(current - 1);
  if (e.key === 'ArrowRight') show(current + 1);
});

// スワイプ（モバイル）
var sx = null;
stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', function (e) {
  if (sx === null) return;
  var dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
  sx = null;
}, { passive: true });

show(0);
</script>
</body>
</html>
